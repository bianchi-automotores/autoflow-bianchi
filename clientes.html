{% extends 'base.html' %}{% block content %}<h1>Clientes y seguimientos</h1><details class='panel' open><summary>+ Nuevo cliente</summary><form method='post' class='formgrid'><input name='name' placeholder='Nombre' required><input name='phone' placeholder='Teléfono'><input name='vehicle' placeholder='Auto de interés'><select name='stage'><option>Nuevo</option><option>Contactado</option><option>Visita</option><option>Negociación</option><option>Reserva</option><option>Vendido</option></select><input name='next_contact' type='date'><select name='seller'><option>Federico</option><option>Gonza</option></select><input name='notes' placeholder='Notas'><button>Guardar seguimiento</button></form></details><div class='panel'><table><tr><th>Cliente</th><th>Teléfono</th><th>Auto</th><th>Estado</th><th>Próximo contacto</th><th>Vendedor</th></tr>{% for x in items %}<tr><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.vehicle}}</td><td>{{x.stage}}</td><td>{{x.next_contact}}</td><td>{{x.seller}}</td></tr>{% endfor %}</table></div>{% endblock %}
